<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthanvayah | Digital Gateway</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --accent: #00b4d8;
      --text: #ffffff;
      --subtext: #8d99ae;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
      min-height: 100vh;
    }
    .profile {
      text-align: center;
      margin-bottom: 30px;
    }
    .profile h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 10px 0 5px;
      color: var(--accent);
    }
    .profile p {
      color: var(--subtext);
      font-size: 0.9rem;
      margin: 0;
    }
    .links-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .link-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 180, 216, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .featured {
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      border: none;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h1>ARTHANVAYAH</h1>
    <p>Quantitative Analytics & Trading Clarity</p>
  </div>

  <div class="links-container">
    <!-- Google Form Direct Registration -->
    <a href="https://docs.google.com/forms/d/1U75XavUqDqrLU-k0DKwTtaTYwv3x9myiQOJg1oese-8/viewform" class="link-card featured" target="_blank">
      🚨 9-Day Navratri Webinar (Oct 11–19)
    </a>

    <!-- Automated WhatsApp Onboarding Trigger -->
    <a href="https://wa.me/919158375129?text=Hi%20Arthanvayah%2C%20I%20want%20to%20register%20for%20the%209-Day%20Navratri%20Webinar!" class="link-card" target="_blank">
      💬 Register via WhatsApp (Automated)
    </a>

    <!-- Telegram Channel for Daily Nifty Updates -->
    <a href="https://t.me/Arthanvayah" class="link-card" target="_blank">
      📢 Daily Nifty Analytics & Telegram Channel
    </a>
  </div>
</body>
</html>
